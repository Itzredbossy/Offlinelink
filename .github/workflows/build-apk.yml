name: Build OfflineLink APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offlinelink-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP, accept SDK licenses, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offlinelink-source"

          ZIP_FILE=""
          if [[ -f "OfflineLink-Fixed-GitHub-Build.zip" ]]; then
            ZIP_FILE="OfflineLink-Fixed-GitHub-Build.zip"
          else
            mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname '*.zip' -print | sort)
            if [[ "${#ZIP_FILES[@]}" -ne 1 ]]; then
              echo "Expected exactly one project ZIP in the repository root; found ${#ZIP_FILES[@]}."
              printf '%s\n' "${ZIP_FILES[@]}"
              exit 1
            fi
            ZIP_FILE="${ZIP_FILES[0]}"
          fi

          echo "Extracting $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/offlinelink-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/offlinelink-source" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "Could not find settings.gradle.kts inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "Found the Gradle settings file, but app/build.gradle.kts is missing."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here: its license prompt
      # was the step that stopped the previous run. Accept licenses non-interactively.
      - name: Accept Android SDK licenses and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools."
            exit 1
          fi
          echo "Using $SDKMANAGER"

          # sdkmanager may close the pipe early after accepting all licenses;
          # tolerate yes receiving SIGPIPE, but fail if sdkmanager itself is absent.
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineLink-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
